<!DOCTYPE html>
<html class="light" lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Bankbook &amp; Reconciliation | LedgerPrecise</title>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#000000",
                        surface: "#f7f9fb",
                        "surface-container": "#eceef0",
                        "surface-container-low": "#f2f4f6",
                        "surface-container-high": "#e6e8ea",
                        "surface-container-lowest": "#ffffff",
                        secondary: "#505f76",
                        "on-primary": "#ffffff",
                        "outline-variant": "#cfc4c5",
                        error: "#ba1a1a"
                    },
                    borderRadius: { DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px" },
                    spacing: { "card-padding": "24px", "outer-padding": "32px", gutter: "24px" },
                    fontFamily: {
                        "body-sm": ["Hanken Grotesk"],
                        "body-md": ["Hanken Grotesk"],
                        "headline-sm": ["Hanken Grotesk"],
                        "label-md": ["JetBrains Mono"]
                    },
                    fontSize: {
                        "body-sm": ["13px", {"lineHeight": "18px", "fontWeight": "400"}],
                        "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500"}]
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f2f4f6; font-family: 'Hanken Grotesk', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; display: inline-block; vertical-align: middle; }
        input:focus, select:focus { border-color: #000000 !important; outline: none !important; box-shadow: 0 0 0 2px #f2f4f6 !important; }
    </style>
</head>
<body class="text-on-background min-h-screen bg-surface flex">

<aside th:replace="~{layouts/accountantLayout :: sidebar('cashAndBank')}"></aside>

<div class="flex-grow flex flex-col min-w-0">
    <header class="bg-surface-container-lowest border-b border-outline-variant sticky top-0 z-50">
        <div class="flex justify-between items-center w-full px-outer-padding h-16">
            <span class="text-headline-sm font-headline-sm text-primary">Cash &amp; Bankbook Reconciliation</span>
        </div>
    </header>

    <main class="p-outer-padding max-w-[1440px] mx-auto w-full space-y-gutter">
        <div id="pageAlert" class="hidden">
            <div id="pageAlertInner" class="flex items-start gap-3 px-4 py-3 rounded-lg border text-body-sm font-semibold">
                <span id="pageAlertIcon" class="material-symbols-outlined text-[18px] mt-0.5"></span>
                <span id="pageAlertMsg"></span>
            </div>
        </div>

        <section class="bg-surface-container-lowest border border-outline-variant rounded-lg p-card-padding">
            <div class="grid grid-cols-1 lg:grid-cols-4 gap-gutter">
                <div class="space-y-2">
                    <label class="font-body-sm text-body-sm font-semibold text-primary block" for="orgSelector">Organization</label>
                    <select id="orgSelector" class="w-full bg-white border border-outline-variant rounded-lg p-3 text-body-md">
                        <option value="">Select organization...</option>
                        <option th:each="org : ${organizations}" th:value="${org.id}" th:text="${org.name}"></option>
                    </select>
                </div>
                <div class="space-y-2">
                    <label class="font-body-sm text-body-sm font-semibold text-primary block" for="bankAccountSelector">Bank Account</label>
                    <select id="bankAccountSelector" class="w-full bg-white border border-outline-variant rounded-lg p-3 text-body-md">
                        <option value="">Select bank account...</option>
                    </select>
                    <button id="toggleBankAccountFormBtn" type="button" class="mt-2 inline-flex items-center gap-1 text-primary hover:opacity-70 transition-opacity font-semibold text-[13px]">
                        <span class="material-symbols-outlined text-[18px]">add_card</span>
                        New Bank Account
                    </button>
                </div>
                <div class="space-y-2">
                    <label class="font-body-sm text-body-sm font-semibold text-primary block" for="reconciliationSelector">Reconciliation</label>
                    <select id="reconciliationSelector" class="w-full bg-white border border-outline-variant rounded-lg p-3 text-body-md">
                        <option value="">No reconciliation selected</option>
                    </select>
                </div>
                <div class="flex items-end gap-2">
                    <button id="autoMatchBtn" class="flex-1 bg-white border border-outline-variant text-primary py-3 px-4 rounded-lg font-bold text-body-sm hover:border-primary disabled:opacity-50" disabled>
                        <span class="material-symbols-outlined text-[18px]">auto_awesome</span>
                        Auto-match
                    </button>
                    <button id="completeBtn" class="flex-1 bg-primary text-on-primary py-3 px-4 rounded-lg font-bold text-body-sm hover:bg-zinc-800 disabled:opacity-50" disabled>
                        <span class="material-symbols-outlined text-[18px]">task_alt</span>
                        Complete
                    </button>
                </div>
            </div>
            <div id="bankAccountFormPanel" class="hidden mt-5 border border-outline-variant rounded-lg p-4 bg-surface-container-low">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <input id="newBankName" class="bg-white border border-outline-variant rounded-lg p-3" placeholder="Bank name">
                    <input id="newBankAccountNumber" class="bg-white border border-outline-variant rounded-lg p-3" placeholder="Account number">
                    <input id="newBankAccountHolder" class="bg-white border border-outline-variant rounded-lg p-3" placeholder="Account holder">
                    <input id="newBankBranchCode" class="bg-white border border-outline-variant rounded-lg p-3" placeholder="Branch code">
                    <input id="newBankCurrency" class="bg-white border border-outline-variant rounded-lg p-3" placeholder="Currency" value="NGN">
                    <input id="newBankBalance" type="number" step="0.01" class="bg-white border border-outline-variant rounded-lg p-3" placeholder="Opening balance">
                    <select id="newBankChartAccount" class="bg-white border border-outline-variant rounded-lg p-3 md:col-span-3">
                        <option value="">Select linked cash/bank GL account...</option>
                    </select>
                </div>
                <textarea id="newBankNotes" class="mt-3 w-full bg-white border border-outline-variant rounded-lg p-3" rows="2" placeholder="Notes"></textarea>
                <div class="flex justify-end gap-2 mt-3">
                    <button id="cancelBankAccountBtn" type="button" class="px-4 h-10 rounded-lg border border-outline-variant text-secondary font-semibold">Cancel</button>
                    <button id="saveBankAccountBtn" type="button" class="px-4 h-10 rounded-lg bg-primary text-on-primary font-bold">Save Bank Account</button>
                </div>
            </div>
        </section>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-gutter items-start">
            <section class="lg:col-span-1 space-y-gutter">
                <div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-card-padding shadow-sm">
                    <h2 class="font-headline-sm text-headline-sm text-primary mb-6">Import Statement</h2>
                    <form id="importForm" class="space-y-5">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div class="space-y-2">
                                <label class="font-body-sm text-body-sm font-semibold text-primary block" for="statementDate">Statement Date</label>
                                <input id="statementDate" type="date" class="w-full bg-white border border-outline-variant rounded-lg p-3 text-body-md">
                            </div>
                            <div class="space-y-2">
                                <label class="font-body-sm text-body-sm font-semibold text-primary block" for="openingBalance">Opening</label>
                                <input id="openingBalance" type="number" step="0.01" class="w-full bg-white border border-outline-variant rounded-lg p-3 text-body-md" placeholder="0.00">
                            </div>
                            <div class="space-y-2 sm:col-span-2">
                                <label class="font-body-sm text-body-sm font-semibold text-primary block" for="closingBalance">Closing Balance</label>
                                <input id="closingBalance" type="number" step="0.01" class="w-full bg-white border border-outline-variant rounded-lg p-3 text-body-md" placeholder="0.00">
                            </div>
                        </div>
                        <div class="space-y-2">
                            <label class="font-body-sm text-body-sm font-semibold text-primary block" for="statementFile">Statement File (.CSV, .XLSX)</label>
                            <input id="statementFile" type="file" accept=".csv,.txt,.xlsx" class="w-full bg-white border border-outline-variant rounded-lg p-3 text-body-md">
                        </div>
                        <button id="importBtn" class="w-full bg-primary text-on-primary py-3 px-6 rounded-lg font-bold font-body-md hover:bg-zinc-800 disabled:opacity-50" type="submit">
                            Process Statement Import
                        </button>
                    </form>
                </div>

                <div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-card-padding">
                    <h3 class="font-label-md text-label-md text-secondary uppercase tracking-widest mb-4">Summary</h3>
                    <div class="space-y-3 text-body-sm">
                        <div class="flex justify-between"><span class="text-secondary">Status</span><span id="summaryStatus" class="font-bold">-</span></div>
                        <div class="flex justify-between"><span class="text-secondary">Imported lines</span><span id="summaryImported" class="font-bold">0</span></div>
                        <div class="flex justify-between"><span class="text-secondary">Matched lines</span><span id="summaryMatched" class="font-bold">0</span></div>
                        <div class="flex justify-between"><span class="text-secondary">Cleared amount</span><span id="summaryCleared" class="font-bold">0.00</span></div>
                        <div class="flex justify-between"><span class="text-secondary">Difference</span><span id="summaryDifference" class="font-bold">0.00</span></div>
                    </div>
                </div>
            </section>

            <section class="lg:col-span-2">
                <div class="bg-surface-container-lowest border border-outline-variant rounded-lg shadow-sm overflow-hidden flex flex-col h-full">
                    <div class="p-card-padding border-b border-outline-variant flex flex-col md:flex-row md:justify-between md:items-center gap-3 bg-surface-container-lowest">
                        <div>
                            <h2 class="font-headline-sm text-headline-sm text-primary">Verification Queue</h2>
                            <p id="queueSubtitle" class="font-body-sm text-body-sm text-secondary">Select a bank account to begin.</p>
                        </div>
                        <span id="pendingBadge" class="inline-flex items-center px-3 py-1 rounded-full bg-surface-container text-secondary font-label-md text-[11px] w-fit">0 PENDING</span>
                    </div>

                    <div class="overflow-x-auto w-full">
                        <table class="w-full text-left border-collapse">
                            <thead>
                            <tr class="bg-surface-container-low border-b border-outline-variant">
                                <th class="px-6 py-4 font-label-md text-label-md text-secondary uppercase tracking-widest text-[11px]">Value Date</th>
                                <th class="px-6 py-4 font-label-md text-label-md text-secondary uppercase tracking-widest text-[11px]">Description</th>
                                <th class="px-6 py-4 font-label-md text-label-md text-secondary uppercase tracking-widest text-[11px] text-right">Amount</th>
                                <th class="px-6 py-4 font-label-md text-label-md text-secondary uppercase tracking-widest text-[11px]">GL Match</th>
                                <th class="px-6 py-4 font-label-md text-label-md text-secondary uppercase tracking-widest text-[11px] text-center">Action</th>
                            </tr>
                            </thead>
                            <tbody id="statementLinesBody" class="divide-y divide-outline-variant">
                            <tr><td colspan="5" class="px-6 py-8 text-center text-secondary">No reconciliation loaded.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>
    </main>
</div>

<script>
    const state = { organizationId: '', bankAccountId: '', reconciliationId: '', reconciliations: [], current: null, chartAccounts: [] };
    const els = {
        alert: document.getElementById('pageAlert'),
        alertInner: document.getElementById('pageAlertInner'),
        alertIcon: document.getElementById('pageAlertIcon'),
        alertMsg: document.getElementById('pageAlertMsg'),
        orgSelector: document.getElementById('orgSelector'),
        bankAccountSelector: document.getElementById('bankAccountSelector'),
        reconciliationSelector: document.getElementById('reconciliationSelector'),
        importForm: document.getElementById('importForm'),
        statementDate: document.getElementById('statementDate'),
        openingBalance: document.getElementById('openingBalance'),
        closingBalance: document.getElementById('closingBalance'),
        statementFile: document.getElementById('statementFile'),
        autoMatchBtn: document.getElementById('autoMatchBtn'),
        completeBtn: document.getElementById('completeBtn'),
        body: document.getElementById('statementLinesBody'),
        queueSubtitle: document.getElementById('queueSubtitle'),
        pendingBadge: document.getElementById('pendingBadge'),
        summaryStatus: document.getElementById('summaryStatus'),
        summaryImported: document.getElementById('summaryImported'),
        summaryMatched: document.getElementById('summaryMatched'),
        summaryCleared: document.getElementById('summaryCleared'),
        summaryDifference: document.getElementById('summaryDifference')
    };

    async function apiJson(url, options = {}) {
        const headers = options.body instanceof FormData ? (options.headers || {}) : { 'Content-Type': 'application/json', ...(options.headers || {}) };
        const response = await fetch(url, { ...options, headers });
        const text = await response.text();
        const data = text ? JSON.parse(text) : null;
        if (!response.ok) throw new Error(data?.message || data?.error || text || `Request failed with ${response.status}`);
        return data;
    }

    function showAlert(message, type = 'success') {
        const success = type === 'success';
        els.alert.classList.remove('hidden');
        els.alertInner.className = `flex items-start gap-3 px-4 py-3 rounded-lg border text-body-sm font-semibold ${success ? 'bg-emerald-50 border-emerald-200 text-emerald-800' : 'bg-red-50 border-red-200 text-red-800'}`;
        els.alertIcon.textContent = success ? 'check_circle' : 'error';
        els.alertMsg.textContent = message;
    }

    function money(value) {
        return Number(value || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function resetCurrent() {
        state.reconciliationId = '';
        state.current = null;
        els.reconciliationSelector.innerHTML = '<option value="">No reconciliation selected</option>';
        render();
    }

    async function loadBankAccounts() {
        resetCurrent();
        state.organizationId = els.orgSelector.value;
        els.bankAccountSelector.innerHTML = '<option value="">Select bank account...</option>';
        if (!state.organizationId) return;
        const [accounts, chartAccounts] = await Promise.all([
            apiJson(`/api/accountant/bank-accounts/org/${state.organizationId}`),
            apiJson(`/api/accountant/chart-of-accounts/org/${state.organizationId}`)
        ]);
        state.chartAccounts = chartAccounts || [];
        populateBankChartAccounts();
        accounts.forEach(account => {
            const option = document.createElement('option');
            option.value = account.id;
            option.textContent = `${account.bankName || 'Bank'} - ${account.accountNumber || account.id}`;
            els.bankAccountSelector.appendChild(option);
        });
        if (!accounts.length) {
            showAlert('No bank accounts found. Use New Bank Account before importing a statement.', 'error');
        }
    }

    function populateBankChartAccounts() {
        const select = document.getElementById('newBankChartAccount');
        const assetAccounts = state.chartAccounts.filter(account => account.accountType === 'ASSET');
        select.innerHTML = assetAccounts.length
            ? '<option value="">Select linked cash/bank GL account...</option>' + assetAccounts.map(account => `<option value="${account.id}">${account.accountCode} - ${account.accountName}</option>`).join('')
            : '<option value="">No asset accounts found</option>';
    }

    function resetBankAccountForm() {
        ['newBankName', 'newBankAccountNumber', 'newBankAccountHolder', 'newBankBranchCode', 'newBankBalance', 'newBankNotes']
            .forEach(id => document.getElementById(id).value = '');
        document.getElementById('newBankCurrency').value = 'NGN';
        document.getElementById('newBankChartAccount').value = '';
        document.getElementById('bankAccountFormPanel').classList.add('hidden');
    }

    async function saveBankAccount() {
        if (!state.organizationId) throw new Error('Select an organization first.');
        const payload = {
            chartAccountId: Number(document.getElementById('newBankChartAccount').value || 0) || null,
            bankName: document.getElementById('newBankName').value.trim(),
            accountNumber: document.getElementById('newBankAccountNumber').value.trim(),
            accountHolder: document.getElementById('newBankAccountHolder').value.trim(),
            branchCode: document.getElementById('newBankBranchCode').value.trim() || null,
            currency: document.getElementById('newBankCurrency').value.trim() || 'NGN',
            balance: Number(document.getElementById('newBankBalance').value || 0),
            notes: document.getElementById('newBankNotes').value.trim() || null,
            active: true
        };
        if (!payload.chartAccountId) throw new Error('Select a linked GL asset account.');
        if (!payload.bankName || !payload.accountNumber || !payload.accountHolder) {
            throw new Error('Bank name, account number, and account holder are required.');
        }
        const created = await apiJson(`/api/accountant/bank-accounts/org/${state.organizationId}`, {
            method: 'POST',
            body: JSON.stringify(payload)
        });
        resetBankAccountForm();
        await loadBankAccounts();
        els.bankAccountSelector.value = created.id;
        await loadReconciliations();
        showAlert('Bank account created.');
    }

    async function loadReconciliations() {
        resetCurrent();
        state.bankAccountId = els.bankAccountSelector.value;
        if (!state.organizationId || !state.bankAccountId) return;
        state.reconciliations = await apiJson(`/api/accountant/bank-reconciliations/org/${state.organizationId}/bank-account/${state.bankAccountId}`);
        els.reconciliationSelector.innerHTML = '<option value="">Select reconciliation...</option>';
        state.reconciliations.forEach(rec => {
            const option = document.createElement('option');
            option.value = rec.id;
            option.textContent = `${rec.statementDate} - ${rec.status} (${rec.matchedLineCount}/${rec.importedLineCount})`;
            els.reconciliationSelector.appendChild(option);
        });
        if (state.reconciliations.length > 0) {
            els.reconciliationSelector.value = state.reconciliations[0].id;
            await loadCurrentReconciliation();
        }
    }

    async function loadCurrentReconciliation() {
        state.reconciliationId = els.reconciliationSelector.value;
        state.current = state.reconciliationId ? await apiJson(`/api/accountant/bank-reconciliations/${state.reconciliationId}`) : null;
        render();
    }

    function render() {
        const rec = state.current;
        els.autoMatchBtn.disabled = !rec || rec.status !== 'DRAFT';
        els.completeBtn.disabled = !rec || rec.status !== 'DRAFT';
        els.summaryStatus.textContent = rec?.status || '-';
        els.summaryImported.textContent = rec?.importedLineCount || 0;
        els.summaryMatched.textContent = rec?.matchedLineCount || 0;
        els.summaryCleared.textContent = money(rec?.clearedAmount);
        els.summaryDifference.textContent = money(rec?.unresolvedDifference);
        const pending = rec ? (rec.importedLineCount - rec.matchedLineCount) : 0;
        els.pendingBadge.textContent = `${pending} PENDING`;
        els.queueSubtitle.textContent = rec ? `${rec.bankName} ${rec.accountNumber || ''} statement dated ${rec.statementDate}` : 'Select a reconciliation to review.';

        if (!rec) {
            els.body.innerHTML = '<tr><td colspan="5" class="px-6 py-8 text-center text-secondary">No reconciliation loaded.</td></tr>';
            return;
        }
        if (!rec.statementLines || rec.statementLines.length === 0) {
            els.body.innerHTML = '<tr><td colspan="5" class="px-6 py-8 text-center text-secondary">No statement lines imported.</td></tr>';
            return;
        }
        els.body.innerHTML = rec.statementLines.map(line => lineRow(line, rec.status)).join('');
    }

    function lineRow(line, status) {
        const matched = line.matchStatus !== 'UNMATCHED';
        const amountClass = Number(line.amount || 0) < 0 ? 'text-error' : 'text-emerald-600';
        const disabled = status !== 'DRAFT' ? 'disabled' : '';
        return `
            <tr class="hover:bg-surface transition-colors" data-line-id="${line.id}">
                <td class="px-6 py-4 font-body-md text-body-md text-primary whitespace-nowrap">${line.transactionDate}</td>
                <td class="px-6 py-4">
                    <p class="font-body-md text-body-md text-primary font-semibold">${escapeHtml(line.description || '')}</p>
                    <p class="text-[12px] text-secondary">Ref: ${escapeHtml(line.referenceNumber || '-')}</p>
                </td>
                <td class="px-6 py-4 font-body-md text-body-md text-right ${amountClass} font-semibold whitespace-nowrap">${money(line.amount)}</td>
                <td class="px-6 py-4 min-w-[260px]">
                    <div class="flex flex-col gap-2">
                        <span class="font-label-md text-[11px] ${matched ? 'text-emerald-700' : 'text-secondary'}">${line.matchStatus}</span>
                        <select class="candidate-select bg-white text-body-sm p-2 rounded border border-outline-variant w-full" ${matched || disabled}>
                            <option value="">Load candidates...</option>
                        </select>
                    </div>
                </td>
                <td class="px-6 py-4 text-center whitespace-nowrap">
                    ${matched
                        ? `<button class="unmatch-btn bg-white border border-outline-variant text-primary px-4 py-2 rounded-lg text-body-sm font-semibold hover:border-primary disabled:opacity-50" ${disabled}>Unmatch</button>`
                        : `<button class="match-btn bg-primary text-on-primary px-4 py-2 rounded-lg text-body-sm font-semibold hover:bg-zinc-800 disabled:opacity-50" ${disabled}>Match</button>`}
                </td>
            </tr>`;
    }

    function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    }

    async function importStatement(event) {
        event.preventDefault();
        if (!state.organizationId || !state.bankAccountId) {
            showAlert('Select an organization and bank account first.', 'error');
            return;
        }
        const file = els.statementFile.files[0];
        if (!file) {
            showAlert('Select a statement file to import.', 'error');
            return;
        }
        const formData = new FormData();
        formData.append('bankAccountId', state.bankAccountId);
        formData.append('statementDate', els.statementDate.value);
        formData.append('openingBalance', els.openingBalance.value);
        formData.append('closingBalance', els.closingBalance.value);
        formData.append('file', file);
        const imported = await apiJson(`/api/accountant/bank-reconciliations/org/${state.organizationId}/import`, { method: 'POST', body: formData });
        showAlert('Statement imported and auto-match completed.');
        await loadReconciliations();
        els.reconciliationSelector.value = imported.id;
        await loadCurrentReconciliation();
    }

    async function loadCandidates(row) {
        const select = row.querySelector('.candidate-select');
        if (!select || select.dataset.loaded === 'true' || select.disabled) return;
        const candidates = await apiJson(`/api/accountant/bank-reconciliations/${state.reconciliationId}/lines/${row.dataset.lineId}/candidates`);
        select.innerHTML = candidates.length ? '<option value="">Select GL entry...</option>' : '<option value="">No candidates found</option>';
        candidates.forEach(gl => {
            const option = document.createElement('option');
            option.value = gl.id;
            option.textContent = `${gl.transactionDate} | ${gl.journalNumber} | ${gl.debitCredit} ${money(gl.amount)} | ${gl.description || ''}`;
            select.appendChild(option);
        });
        select.dataset.loaded = 'true';
    }

    async function handleTableClick(event) {
        const row = event.target.closest('tr[data-line-id]');
        if (!row) return;
        if (event.target.closest('.match-btn')) {
            const select = row.querySelector('.candidate-select');
            if (!select.value) {
                showAlert('Select a GL candidate before matching.', 'error');
                return;
            }
            state.current = await apiJson(`/api/accountant/bank-reconciliations/${state.reconciliationId}/lines/${row.dataset.lineId}/match`, {
                method: 'PATCH',
                body: JSON.stringify({ generalLedgerId: select.value })
            });
            showAlert('Statement line matched.');
            render();
        }
        if (event.target.closest('.unmatch-btn')) {
            state.current = await apiJson(`/api/accountant/bank-reconciliations/${state.reconciliationId}/lines/${row.dataset.lineId}/unmatch`, { method: 'PATCH' });
            showAlert('Statement line unmatched.');
            render();
        }
    }

    async function handleAutoMatch() {
        state.current = await apiJson(`/api/accountant/bank-reconciliations/${state.reconciliationId}/auto-match`, { method: 'PATCH' });
        showAlert('Auto-match completed.');
        render();
    }

    async function handleComplete() {
        const completed = await apiJson(`/api/accountant/bank-reconciliations/${state.reconciliationId}/complete`, { method: 'PATCH' });
        showAlert('Reconciliation completed.');
        await loadReconciliations();
        els.reconciliationSelector.value = completed.id;
        await loadCurrentReconciliation();
    }

    els.orgSelector.addEventListener('change', () => loadBankAccounts().catch(err => showAlert(err.message, 'error')));
    els.bankAccountSelector.addEventListener('change', () => loadReconciliations().catch(err => showAlert(err.message, 'error')));
    els.reconciliationSelector.addEventListener('change', () => loadCurrentReconciliation().catch(err => showAlert(err.message, 'error')));
    els.importForm.addEventListener('submit', event => importStatement(event).catch(err => showAlert(err.message, 'error')));
    document.getElementById('toggleBankAccountFormBtn').addEventListener('click', () => document.getElementById('bankAccountFormPanel').classList.toggle('hidden'));
    document.getElementById('cancelBankAccountBtn').addEventListener('click', resetBankAccountForm);
    document.getElementById('saveBankAccountBtn').addEventListener('click', () => saveBankAccount().catch(err => showAlert(err.message, 'error')));
    els.body.addEventListener('click', event => handleTableClick(event).catch(err => showAlert(err.message, 'error')));
    els.body.addEventListener('focusin', event => {
        const row = event.target.closest('tr[data-line-id]');
        if (row && event.target.classList.contains('candidate-select')) {
            loadCandidates(row).catch(err => showAlert(err.message, 'error'));
        }
    });
    els.autoMatchBtn.addEventListener('click', () => handleAutoMatch().catch(err => showAlert(err.message, 'error')));
    els.completeBtn.addEventListener('click', () => handleComplete().catch(err => showAlert(err.message, 'error')));
</script>
</body>
</html>
