name: build-ams

on:
  push:
    branches:
      - master

jobs:
  build-image:
    name: Build and push to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and push with Jib
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: >
          mvn -B clean package jib:build -Dmaven.test.skip=true
          -Djib.to.image=$DOCKER_USERNAME/ams:${{ github.sha }}
          -Djib.to.auth.username=$DOCKER_USERNAME
          -Djib.to.auth.password=$DOCKER_PASSWORD

  deploy:
    name: Deploy to Coolify on Contabo
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - name: Update Coolify image tag
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          curl --fail-with-body --show-error --silent \
            --request PATCH \
            --header "Authorization: Bearer $COOLIFY_TOKEN" \
            --header "Content-Type: application/json" \
            "$COOLIFY_URL/api/v1/applications/$COOLIFY_APP_UUID" \
            --data "{\"docker_registry_image_tag\":\"$IMAGE_TAG\"}"

      - name: Trigger Coolify deployment
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          set -euo pipefail
          curl --fail-with-body --show-error --silent \
            --request POST \
            --header "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_URL/api/v1/deploy?uuid=$COOLIFY_APP_UUID&force=true"